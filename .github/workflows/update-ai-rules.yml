name: Update AI rules

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-ai-rules.py
      - sources/**
      - .github/workflows/update-ai-rules.yml

permissions:
  contents: write

concurrency:
  group: update-ai-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rule sets
        run: |
          ok=0
          for attempt in 1 2 3; do
            if python3 scripts/build-ai-rules.py; then
              ok=1
              break
            fi
            echo "build attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          test "$ok" -eq 1

      - name: Commit
        run: |
          if git diff --quiet -I '^# UPDATED: ' -I '^# CHANGED: ' -- rules; then
            summary="no rule changes"
          else
            summary="rules changed"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u rules
          if git diff --cached --quiet; then
            echo "no file changes"
            exit 0
          fi
          git commit -m "Update AI rules $(date -u +%F): ${summary}"
          git pull --rebase origin main
          git push
